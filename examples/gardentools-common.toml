#General settings
[gardentools]

	[gardentools.cultivator]
		#
		#Range of cultivator item
		# Default: 9
		# Range: 2 ~ 32
		range = 9
		#
		#Moisture level set by cultivator
		# Default: 7
		# Range: 0 ~ 7
		moisture = 7

	[gardentools.planter]
		#
		#Range of planter item
		# Default: 9
		# Range: 2 ~ 32
		range = 9

	[gardentools.irrigator]
		#
		#Watering radius of irrigation block
		# Default: 8
		# Range: 1 ~ 64
		radius = 8
		#
		#Is this a water source for buckets and capabilities
		water_source = true

	[gardentools.watering]
		#
		#Watering can range
		# Default: 4
		# Range: 1 ~ 32
		range = 4
		#
		#Power of the watering can: 0.1 is very weak and 0.99 is very strong
		# Default: 0.5
		# Range: 0.0010000000474974513 ~ 1.0
		power = 0.5

	[gardentools.fertilizer]
		#
		#The bonemeal-power of the fertilizer
		# Default: 6
		# Range: 1 ~ 32
		power = 6

	[gardentools.feeder]
		#
		#Livestock Feeder range
		# Default: 8
		# Range: 1 ~ 32
		range = 8

	[gardentools.rancher]
		#
		#Livestock Rancher range
		# Default: 8
		# Range: 1 ~ 32
		range = 8

	[gardentools.magnet]
		#
		#Magnet max range
		# Default: 16
		# Range: 1 ~ 256
		range = 16

		[gardentools.magnet.speed]
			#
			#Magnet speed when items are close within 3 blocks
			# Default: 0.07000000029802322
			# Range: 0.009999999776482582 ~ 0.5
			close = 0.07000000029802322
			#
			#Magnet speed when items are farther out than 3 blocks
			# Default: 0.3100000023841858
			# Range: 0.009999999776482582 ~ 0.9900000095367432
			far = 0.3100000023841858
